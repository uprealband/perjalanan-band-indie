name: Build Music Hub Catalog

on:
  push:
    paths:
      - 'audio/**/*.mp3'
      - 'track/**'
      - 'artwork/**'
      - 'scripts/generate_catalog.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata reader
        run: pip install mutagen

      - name: Generate catalog.json
        run: python scripts/generate_catalog.py

      - name: Commit catalog.json and artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json artwork/
          if git diff --cached --quiet; then
            echo 'No catalog/artwork changes.'
          else
            git commit -m 'chore: update Music Hub catalog'
            git push
          fi
