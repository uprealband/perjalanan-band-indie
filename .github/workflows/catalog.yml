name: Build Music Hub Catalog

on:
  push:
    paths:
      - 'audio/**/*.mp3'
      - 'archive/**'
      - 'artwork/**'
      - 'scripts/generate_catalog.py'
      - 'video/videos.json'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata and document thumbnail tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          pip install mutagen pymupdf

      - name: Preserve previous catalog
        run: |
          if [ -f catalog.json ]; then
            cp catalog.json /tmp/catalog.previous.json
          else
            printf '%s\n' '{"tracks":[],"stories":[],"podcasts":[]}' > /tmp/catalog.previous.json
          fi

      - name: Generate catalog.json
        run: python scripts/generate_catalog.py

      - name: Add catalog timestamps
        run: |
          python - <<'PY'
          import json
          import subprocess
          from urllib.parse import unquote

          catalog_path = 'catalog.json'
          previous_path = '/tmp/catalog.previous.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(previous_path, 'r', encoding='utf-8') as f:
              previous = json.load(f)

          previous_added = {}
          for key in ('tracks', 'podcasts'):
              for item in previous.get(key, []):
                  if item.get('id') and item.get('addedAt'):
                      previous_added[item['id']] = item['addedAt']

          def git_added_at(audio_url):
              marker = '/main/'
              if not audio_url or marker not in audio_url:
                  return ''
              rel = unquote(audio_url.split(marker, 1)[1])
              try:
                  result = subprocess.run(
                      ['git', 'log', '-1', '--format=%cI', '--', rel],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  return result.stdout.strip()
              except Exception:
                  return ''

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  stamp = git_added_at(item.get('audio', ''))
                  if stamp:
                      item['addedAt'] = stamp
                  elif item.get('id') in previous_added:
                      item['addedAt'] = previous_added[item['id']]

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Normalize Cover category and audio URLs
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote

          path = 'catalog.json'
          with open(path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)

          def safe_audio_url(url):
              marker = '/main/'
              if marker not in url:
                  return url
              base, rel = url.split(marker, 1)
              encoded = '/'.join(quote(part, safe='') for part in rel.split('/'))
              return base + marker + encoded

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  if item.get('audio'):
                      item['audio'] = safe_audio_url(item['audio'])

                  if key == 'tracks':
                      album = str(item.get('album', '')).strip().lower()
                      genre = str(item.get('genre', '')).strip().lower()
                      universe = str(item.get('universe', '')).strip().lower()
                      if album == 'cover' or genre == 'cover' or universe == 'cover':
                          item['type'] = 'cover'
                          item['universe'] = 'COVER'

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Merge representative video metadata
        run: |
          python - <<'PY'
          import json

          catalog_path = 'catalog.json'
          video_path = 'video/videos.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(video_path, 'r', encoding='utf-8') as f:
              videos = json.load(f)

          for track in catalog.get('tracks', []):
              key = f"{track.get('id', '')}|{track.get('universe', '')}"
              if key in videos:
                  for field, value in videos[key].items():
                      track[field] = value

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Generate document thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import fitz

          ROOT = Path('archive')
          OUT = Path('archive/_thumbnails')
          DOC_EXT = {'.pdf', '.ppt', '.pptx'}

          if not ROOT.exists():
              raise SystemExit(0)

          def thumb_path(src):
              rel = src.relative_to(ROOT)
              return OUT / rel.parent / (src.stem + '.webp')

          for src in sorted(ROOT.rglob('*')):
              if not src.is_file() or '_thumbnails' in src.parts:
                  continue
              if src.suffix.lower() not in DOC_EXT:
                  continue

              out = thumb_path(src)
              out.parent.mkdir(parents=True, exist_ok=True)

              try:
                  pdf_path = src
                  temp_dir = None

                  if src.suffix.lower() in {'.ppt', '.pptx'}:
                      temp_dir = Path(tempfile.mkdtemp(prefix='ub-ppt-'))
                      result = subprocess.run(
                          [
                              'libreoffice', '--headless', '--convert-to', 'pdf',
                              '--outdir', str(temp_dir), str(src)
                          ],
                          check=False,
                          capture_output=True,
                          text=True,
                      )
                      candidate = temp_dir / (src.stem + '.pdf')
                      if result.returncode != 0 or not candidate.exists():
                          print(f'SKIP PPT: {src}: {result.stdout} {result.stderr}')
                          if temp_dir:
                              shutil.rmtree(temp_dir, ignore_errors=True)
                          continue
                      pdf_path = candidate

                  with fitz.open(pdf_path) as doc:
                      if len(doc) == 0:
                          raise ValueError('empty document')
                      page = doc[0]
                      pix = page.get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
                      pix.save(str(out), 'webp', quality=82)

                  print(f'THUMB: {src} -> {out}')
                  if temp_dir:
                      shutil.rmtree(temp_dir, ignore_errors=True)

              except Exception as exc:
                  print(f'SKIP: {src}: {exc}')

          PY

      - name: Generate archive visitor index
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('archive')
          THUMB_ROOT = ROOT / '_thumbnails'
          META_EXT = {'.txt', '.json', '.md', '.yml', '.yaml'}
          VIDEO_EXT = {'.mp4', '.webm', '.mov', '.m4v', '.ogv'}
          AUDIO_EXT = {'.mp3', '.wav', '.m4a', '.aac', '.flac', '.ogg', '.oga'}

          items = []
          photos = []
          years = {}

          def thumbnail_for(path):
              if path.suffix.lower() not in {'.pdf', '.ppt', '.pptx'}:
                  return ''
              rel = path.relative_to(ROOT)
              thumb = THUMB_ROOT / rel.parent / (path.stem + '.webp')
              return thumb.as_posix() if thumb.exists() else ''

          if ROOT.exists():
              for year_dir in sorted(ROOT.iterdir(), key=lambda p: p.name.lower()):
                  if not year_dir.is_dir() or not year_dir.name.isdigit() or len(year_dir.name) != 4:
                      continue
                  year = year_dir.name
                  years.setdefault(year, {'photos': 0, 'documents': 0, 'videos': 0, 'audio': 0})

                  for category in ('photos', 'documents', 'videos', 'audio'):
                      base = year_dir / category
                      if not base.exists():
                          continue

                      relevant_files = []
                      for p in base.rglob('*'):
                          if not p.is_file():
                              continue
                          ext = p.suffix.lower()
                          if p.name.lower() in {'readme.md', '.gitkeep'} or ext in META_EXT:
                              continue
                          if category == 'videos' and ext not in VIDEO_EXT:
                              continue
                          if category == 'audio' and ext not in AUDIO_EXT:
                              continue
                          if category == 'photos' and ext not in {'.jpg', '.jpeg', '.png', '.webp', '.gif'}:
                              continue
                          relevant_files.append(p)

                      relevant_dirs = set()
                      for p in relevant_files:
                          parent = p.parent
                          while parent != base and base in parent.parents:
                              relevant_dirs.add(parent)
                              parent = parent.parent

                      for d in sorted(relevant_dirs, key=lambda p: p.as_posix().lower()):
                          items.append({
                              'year': year,
                              'category': category,
                              'type': 'dir',
                              'name': d.name,
                              'path': d.as_posix(),
                          })

                      for p in sorted(relevant_files, key=lambda p: p.as_posix().lower()):
                          item = {
                              'year': year,
                              'category': category,
                              'type': 'file',
                              'name': p.name,
                              'path': p.as_posix(),
                          }
                          thumb = thumbnail_for(p)
                          if thumb:
                              item['thumbnail'] = thumb
                          items.append(item)
                          years[year][category] += 1
                          if category == 'photos':
                              photos.append(p.as_posix())

          photos.sort(key=str.lower)
          with open('archive/photos.json', 'w', encoding='utf-8') as f:
              json.dump({'photos': photos}, f, ensure_ascii=False, indent=2)
              f.write('\n')

          payload = {
              'version': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'items': items,
              'years': years,
          }

          with open('archive-index.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit catalog and archive indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json artwork/ archive/photos.json archive-index.json archive/_thumbnails/
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: update catalog and archive thumbnails'
            git push
          fi
