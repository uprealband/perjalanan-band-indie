name: Build Music Hub Catalog

on:
  push:
    paths:
      - 'audio/**/*.mp3'
      - 'artwork/**'
      - 'scripts/generate_catalog.py'
      - 'video/videos.json'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata reader
        run: pip install mutagen

      - name: Preserve previous catalog
        run: |
          if [ -f catalog.json ]; then
            cp catalog.json /tmp/catalog.previous.json
          else
            printf '%s\n' '{"tracks":[],"stories":[],"podcasts":[]}' > /tmp/catalog.previous.json
          fi

      - name: Generate catalog.json
        run: python scripts/generate_catalog.py

      - name: Add catalog timestamps
        run: |
          python - <<'PY'
          import json
          import subprocess
          from urllib.parse import unquote

          catalog_path = 'catalog.json'
          previous_path = '/tmp/catalog.previous.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(previous_path, 'r', encoding='utf-8') as f:
              previous = json.load(f)

          previous_added = {}
          for key in ('tracks', 'podcasts'):
              for item in previous.get(key, []):
                  if item.get('id') and item.get('addedAt'):
                      previous_added[item['id']] = item['addedAt']

          def git_added_at(audio_url):
              marker = '/main/'
              if not audio_url or marker not in audio_url:
                  return ''
              rel = unquote(audio_url.split(marker, 1)[1])
              try:
                  result = subprocess.run(
                      ['git', 'log', '-1', '--format=%cI', '--', rel],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  return result.stdout.strip()
              except Exception:
                  return ''

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  item_id = item.get('id', '')
                  if item_id in previous_added:
                      item['addedAt'] = previous_added[item_id]
                  else:
                      stamp = git_added_at(item.get('audio', ''))
                      if stamp:
                          item['addedAt'] = stamp

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Normalize Cover category and audio URLs
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote

          path = 'catalog.json'
          with open(path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)

          def safe_audio_url(url):
              marker = '/main/'
              if marker not in url:
                  return url
              base, rel = url.split(marker, 1)
              encoded = '/'.join(quote(part, safe='') for part in rel.split('/'))
              return base + marker + encoded

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  if item.get('audio'):
                      item['audio'] = safe_audio_url(item['audio'])

                  if key == 'tracks':
                      album = str(item.get('album', '')).strip().lower()
                      genre = str(item.get('genre', '')).strip().lower()
                      universe = str(item.get('universe', '')).strip().lower()
                      if album == 'cover' or genre == 'cover' or universe == 'cover':
                          item['type'] = 'cover'
                          item['universe'] = 'COVER'

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Merge representative video metadata
        run: |
          python - <<'PY'
          import json

          catalog_path = 'catalog.json'
          video_path = 'video/videos.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(video_path, 'r', encoding='utf-8') as f:
              videos = json.load(f)

          for track in catalog.get('tracks', []):
              key = f"{track.get('id', '')}|{track.get('universe', '')}"
              if key in videos:
                  for field, value in videos[key].items():
                      track[field] = value

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit catalog.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json artwork/
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: update Music Hub catalog'
            git push
          fi
