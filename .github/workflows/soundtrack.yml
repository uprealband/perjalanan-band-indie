name: Build Soundtrack Playlist

concurrency:
  group: music-index-build
  cancel-in-progress: false

on:
  push:
    paths:
      - 'archive/**'
      - 'scripts/generate_soundtrack.py'
      - '.github/workflows/soundtrack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-soundtrack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata tools
        run: pip install mutagen

      - name: Generate soundtrack.json from MP3 metadata
        run: python scripts/generate_soundtrack.py

      - name: Validate soundtrack.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('audio/soundtrack/soundtrack.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if not isinstance(data, dict):
              raise SystemExit('soundtrack.json must contain an object')
          if not isinstance(data.get('soundtracks'), list):
              raise SystemExit('soundtracks must be an array')

          required = {'id', 'type', 'context', 'title', 'artist', 'audio'}
          ids = set()

          for item in data['soundtracks']:
              if not isinstance(item, dict):
                  raise SystemExit('Each soundtrack entry must be an object')
              missing = required - set(item)
              if missing:
                  raise SystemExit(f'Missing fields: {sorted(missing)}')
              if item['type'] != 'soundtrack':
                  raise SystemExit(f"Invalid type for {item.get('id')}: {item.get('type')}")
              if item['context'] != 'moment':
                  raise SystemExit(f"Invalid context for {item.get('id')}: {item.get('context')}")
              if item['id'] in ids:
                  raise SystemExit(f"Duplicate soundtrack id: {item.get('id')}")
              ids.add(item['id'])

          print(f'[OK] soundtrack.json valid | {len(data["soundtracks"])} soundtrack(s)')
          for item in data['soundtracks']:
              print(f"[OK] {item['id']} -> {item['audio']}")
          PY

      - name: Commit soundtrack playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/soundtrack/soundtrack.json
          if git diff --cached --quiet; then
            echo 'No soundtrack changes.'
            exit 0
          fi

          git commit -m 'chore: update soundtrack playlist'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Soundtrack push succeeded on attempt $attempt."
                exit 0
              fi
            else
              echo 'Soundtrack rebase failed because the playlist conflicts with a newer main.'
              exit 1
            fi
            echo "Push raced with another commit. Retrying in 3 seconds..."
            sleep 3
          done

          echo 'Soundtrack push failed after 5 attempts.'
          exit 1
