name: Build Music Hub Catalog

on:
  push:
    paths:
      - 'audio/**/*.mp3'
      - 'archive/**'
      - 'artwork/**'
      - 'scripts/generate_catalog.py'
      - 'video/videos.json'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

# Prevent two uploads close together from generating the index at the same time.
# Every run is allowed to finish so the newest repository state is indexed.
concurrency:
  group: archive-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata reader
        run: pip install mutagen

      - name: Preserve previous catalog
        run: |
          if [ -f catalog.json ]; then
            cp catalog.json /tmp/catalog.previous.json
          else
            printf '%s\n' '{"tracks":[],"stories":[],"podcasts":[]}' > /tmp/catalog.previous.json
          fi

      - name: Generate catalog.json
        run: python scripts/generate_catalog.py

      - name: Add catalog timestamps
        run: |
          python - <<'PY'
          import json
          import subprocess
          from urllib.parse import unquote

          catalog_path = 'catalog.json'
          previous_path = '/tmp/catalog.previous.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(previous_path, 'r', encoding='utf-8') as f:
              previous = json.load(f)

          previous_added = {}
          for key in ('tracks', 'podcasts'):
              for item in previous.get(key, []):
                  if item.get('id') and item.get('addedAt'):
                      previous_added[item['id']] = item['addedAt']

          def git_added_at(audio_url):
              marker = '/main/'
              if not audio_url or marker not in audio_url:
                  return ''
              rel = unquote(audio_url.split(marker, 1)[1])
              try:
                  result = subprocess.run(
                      ['git', 'log', '-1', '--format=%cI', '--', rel],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  return result.stdout.strip()
              except Exception:
                  return ''

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  stamp = git_added_at(item.get('audio', ''))
                  if stamp:
                      item['addedAt'] = stamp
                  elif item.get('id') in previous_added:
                      item['addedAt'] = previous_added[item['id']]

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Normalize Cover category and audio URLs
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote

          path = 'catalog.json'
          with open(path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)

          def safe_audio_url(url):
              marker = '/main/'
              if marker not in url:
                  return url
              base, rel = url.split(marker, 1)
              encoded = '/'.join(quote(part, safe='') for part in rel.split('/'))
              return base + marker + encoded

          for key in ('tracks', 'podcasts'):
              for item in catalog.get(key, []):
                  if item.get('audio'):
                      item['audio'] = safe_audio_url(item['audio'])

                  if key == 'tracks':
                      album = str(item.get('album', '')).strip().lower()
                      genre = str(item.get('genre', '')).strip().lower()
                      universe = str(item.get('universe', '')).strip().lower()
                      if album == 'cover' or genre == 'cover' or universe == 'cover':
                          item['type'] = 'cover'
                          item['universe'] = 'COVER'

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Merge representative video metadata
        run: |
          python - <<'PY'
          import json

          catalog_path = 'catalog.json'
          video_path = 'video/videos.json'

          with open(catalog_path, 'r', encoding='utf-8') as f:
              catalog = json.load(f)
          with open(video_path, 'r', encoding='utf-8') as f:
              videos = json.load(f)

          for track in catalog.get('tracks', []):
              key = f"{track.get('id', '')}|{track.get('universe', '')}"
              if key in videos:
                  for field, value in videos[key].items():
                      track[field] = value

          with open(catalog_path, 'w', encoding='utf-8') as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Generate archive visitor index
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('archive')
          META_EXT = {'.txt', '.json', '.md', '.yml', '.yaml'}
          VIDEO_EXT = {'.mp4', '.webm', '.mov', '.m4v', '.ogv'}
          PHOTO_EXT = {'.jpg', '.jpeg', '.png', '.webp', '.gif'}
          IGNORED_NAMES = {'.gitkeep', '.ds_store', 'readme.md', 'metadata.json'}

          items = []
          photos = []
          years = {}
          seen_paths = set()

          if ROOT.exists():
              for year_dir in sorted(ROOT.iterdir(), key=lambda p: p.name.lower()):
                  if not year_dir.is_dir() or not year_dir.name.isdigit() or len(year_dir.name) != 4:
                      continue

                  year = year_dir.name
                  years.setdefault(year, {'photos': 0, 'documents': 0, 'videos': 0})

                  for category in ('photos', 'documents', 'videos'):
                      base = year_dir / category
                      if not base.is_dir():
                          continue

                      relevant_files = []

                      for p in base.rglob('*'):
                          if not p.is_file():
                              continue

                          name_lower = p.name.lower()
                          ext = p.suffix.lower()

                          # Keep these files in GitHub, but never expose/count them.
                          if name_lower in IGNORED_NAMES:
                              continue

                          # Internal metadata is never an archive item.
                          if ext in META_EXT:
                              continue

                          if category == 'videos' and ext not in VIDEO_EXT:
                              continue

                          if category == 'photos' and ext not in PHOTO_EXT:
                              continue

                          # Documents accept real files other than the metadata extensions above.
                          relevant_files.append(p)

                      relevant_dirs = set()

                      for p in relevant_files:
                          parent = p.parent
                          while parent != base and base in parent.parents:
                              relevant_dirs.add(parent)
                              parent = parent.parent

                      for d in sorted(relevant_dirs, key=lambda p: p.as_posix().lower()):
                          items.append({
                              'year': year,
                              'category': category,
                              'type': 'dir',
                              'name': d.name,
                              'path': d.as_posix(),
                          })

                      for p in sorted(relevant_files, key=lambda p: p.as_posix().lower()):
                          rel = p.as_posix()

                          # Defensive duplicate protection.
                          if rel in seen_paths:
                              continue
                          seen_paths.add(rel)

                          items.append({
                              'year': year,
                              'category': category,
                              'type': 'file',
                              'name': p.name,
                              'path': rel,
                          })

                          years[year][category] += 1

                          if category == 'photos':
                              photos.append(rel)

          photos.sort(key=str.lower)

          with open('archive/photos.json', 'w', encoding='utf-8') as f:
              json.dump({'photos': photos}, f, ensure_ascii=False, indent=2)
              f.write('\n')

          payload = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'items': items,
              'years': years,
          }

          with open('archive-index.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')

          # Hard verification: if a real archive file exists, it must be represented.
          expected = []
          for p in ROOT.rglob('*') if ROOT.exists() else []:
              if not p.is_file():
                  continue
              parts = p.parts
              if len(parts) < 3 or not parts[1].isdigit() or len(parts[1]) != 4:
                  continue
              category = parts[2].lower()
              if category not in {'photos', 'documents', 'videos'}:
                  continue

              name_lower = p.name.lower()
              ext = p.suffix.lower()

              if name_lower in IGNORED_NAMES or ext in META_EXT:
                  continue
              if category == 'videos' and ext not in VIDEO_EXT:
                  continue
              if category == 'photos' and ext not in PHOTO_EXT:
                  continue

              expected.append(p.as_posix())

          indexed = {
              item['path']
              for item in items
              if item.get('type') == 'file'
          }

          missing = sorted(set(expected) - indexed)

          print(f'Archive files detected : {len(expected)}')
          print(f'Archive files indexed  : {len(indexed)}')
          print(f'Archive years detected : {len(years)}')

          if missing:
              print('ERROR: These archive files were not indexed:')
              for path in missing:
                  print(f'  - {path}')
              raise SystemExit(1)

          print('Archive index verification: OK')
          PY

      - name: Verify generated archive index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('archive-index.json')
          if not path.is_file():
              raise SystemExit('archive-index.json was not generated')

          with path.open('r', encoding='utf-8') as f:
              data = json.load(f)

          if not isinstance(data.get('items'), list):
              raise SystemExit('archive-index.json: items is not a list')

          if not isinstance(data.get('years'), dict):
              raise SystemExit('archive-index.json: years is not an object')

          for item in data['items']:
              for key in ('year', 'category', 'type', 'name', 'path'):
                  if not item.get(key):
                      raise SystemExit(f'Invalid archive item: {item}')

          print(f"Verified archive-index.json: {len(data['items'])} items, {len(data['years'])} years")
          PY

      - name: Commit generated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add catalog.json artwork/ archive/photos.json archive-index.json

          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: update Music Hub and archive catalog'
            git push
          fi
